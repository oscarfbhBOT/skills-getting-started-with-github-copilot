<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Instituto Mergington</h1>
      <h2>Actividades extracurriculares</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Actividades disponibles</h3>
        <div id="activities-list">
          <!-- Aquí se cargarán las actividades -->
          <p>Cargando actividades...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Inscribirse en una actividad</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Correo del estudiante:</label>
            <input type="email" id="email" required placeholder="tu-correo@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Selecciona una actividad:</label>
            <select id="activity" required>
              <option value="">-- Selecciona una actividad --</option>
              <!-- Aquí se cargarán las opciones -->
            </select>
          </div>
          <button type="submit" id="signup-button">
            <span class="spinner hidden" aria-hidden="true"></span>
            <span class="btn-label">Inscribirse</span>
          </button>
        </form>
        <!-- Región ARIA para que los lectores de pantalla anuncien mensajes dinámicos -->
        <div id="message" class="hidden" role="status" aria-live="polite" aria-atomic="true"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
